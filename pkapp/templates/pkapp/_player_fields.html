<div class="form-group">
  <label>Nome <span style="color:#c94848">*</span></label>
  <input type="text" name="player" class="form-control" required maxlength="40">
</div>
<div class="form-group">
  <label>Telefone <span style="color:#c94848">*</span></label>
  <input type="text" name="telefone" class="form-control" required maxlength="14">
</div>
<div class="form-group">
  <label>Email</label>
  <input type="email" name="email" class="form-control" maxlength="40">
</div>
<div class="form-group">
  <label>Rede Social</label>
  <input type="text" name="redesocial" class="form-control" maxlength="30">
</div>
<div class="form-group">
  <label>Participações</label>
  <input type="number" name="participacoes" class="form-control" value="0" min="0">
</div>
