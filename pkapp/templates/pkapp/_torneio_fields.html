<div class="form-group">
  <label>Nome do Torneio</label>
  <input type="text" name="torneio" class="form-control" required maxlength="30">
</div>
<div class="row">
  <div class="col-6">
    <div class="form-group">
      <label>Qtd. Etapas</label>
      <input type="number" name="qtd_etapas" class="form-control" required min="1">
    </div>
  </div>
  <div class="col-6">
    <div class="form-group">
      <label>Max. Rebuy</label>
      <input type="number" name="qtd_rebuy" class="form-control" required min="0">
    </div>
  </div>
</div>
<div class="row">
  <div class="col-6">
    <div class="form-group">
      <label>Qtd. Players</label>
      <input type="number" name="qtd_players" class="form-control" required min="1">
    </div>
  </div>
  <div class="col-6">
    <div class="form-group">
      <label>Valor Buy-in (R$)</label>
      <input type="number" name="vlr_buyinn" class="form-control" required step="0.01" min="0">
    </div>
  </div>
</div>
<div class="row">
  <div class="col-4">
    <div class="form-group">
      <label>Valor Rebuy (R$)</label>
      <input type="number" name="vlr_rebuy" class="form-control" required step="0.01" min="0">
    </div>
  </div>
  <div class="col-4">
    <div class="form-group">
      <label>Valor Jackpot (R$)</label>
      <input type="number" name="vlr_jackpot" class="form-control" required step="0.01" min="0">
    </div>
  </div>
  <div class="col-4">
    <div class="form-group">
      <label>Taxa Adm. (R$)</label>
      <input type="number" name="vlr_txadm" class="form-control" required step="0.01" min="0" value="0">
    </div>
  </div>
</div>
<div class="form-group">
  <label>Estrutura de Blinds</label>
  <select name="estrutura_blinds" class="form-control">
    <option value="">— Nenhuma —</option>
    {% for eb in estruturas_blinds %}
    <option value="{{ eb.id }}">{{ eb.nome }}</option>
    {% endfor %}
  </select>
</div>
