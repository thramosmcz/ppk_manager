version: '3.3'

services:
  # Postgres
  db:
    image: postgres:14
    environment:
      - POSTGRES_USER=tournament
      - POSTGRES_PASSWORD=senha@123
      - POSTGRES_DB=pktour

  web:
    build: .
    command: ["./run_web.sh"]
    volumes:
      - .:/webapps
    ports:
      - "8000:8000"
    links:
      - db
    depends_on:
      - db
